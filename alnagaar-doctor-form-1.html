<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل اهتمام الأطباء | AL NAGAAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0055a5;
      --primary-dark: #003d7a;
      --accent: #00a3e0;
      --light-bg: #f0f7fc;
      --card-bg: #ffffff;
      --text: #1a2b3c;
      --muted: #5a6a7a;
      --border: #d0e3f0;
      --success: #0d9488;
      --radius: 16px;
      --shadow: 0 10px 40px rgba(0, 85, 165, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(160deg, #e8f4fc 0%, #f5f9fc 40%, #eef6fb 100%);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.6;
      padding: 20px 12px 40px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    /* Header / Logo */
    .header {
      text-align: center;
      margin-bottom: 28px;
      padding-top: 10px;
    }

    .logo-wrap {
      background: white;
      display: inline-block;
      padding: 18px 32px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .logo-wrap img {
      max-width: 320px;
      width: 100%;
      height: auto;
      display: block;
    }

    .header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .header p {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 500;
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 28px;
      border: 1px solid rgba(0, 85, 165, 0.06);
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: var(--primary-dark);
    }

    label .required {
      color: #e11d48;
      margin-right: 3px;
    }

    input[type="text"],
    input[type="tel"],
    select,
    textarea {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      color: var(--text);
      background: #fafcfe;
      transition: all 0.2s ease;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(0, 163, 224, 0.15);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    /* Devices grid */
    .devices-section {
      background: var(--light-bg);
      border-radius: 14px;
      padding: 18px 16px;
      border: 1px solid var(--border);
    }

    .devices-section > label {
      margin-bottom: 14px;
      font-size: 1rem;
    }

    .devices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .device-item {
      position: relative;
    }

    .device-item input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .device-item label {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px 8px;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 0;
      color: var(--text);
      min-height: 48px;
    }

    .device-item input:checked + label {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(0, 85, 165, 0.25);
      transform: translateY(-1px);
    }

    .device-item label:hover {
      border-color: var(--accent);
    }

    /* Submit */
    .submit-wrap {
      margin-top: 28px;
      text-align: center;
    }

    button[type="submit"] {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: white;
      border: none;
      padding: 16px 48px;
      font-size: 1.15rem;
      font-weight: 700;
      font-family: inherit;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 24px rgba(0, 85, 165, 0.3);
      width: 100%;
      max-width: 320px;
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 85, 165, 0.4);
    }

    button[type="submit"]:active {
      transform: translateY(0);
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    /* Success message (hidden by default) */
    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    .success-msg.show {
      display: block;
    }

    .success-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #0d9488, #14b8a6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 36px;
      color: white;
    }

    /* Responsive */
    @media (max-width: 520px) {
      .card {
        padding: 24px 18px;
      }
      .header h1 {
        font-size: 1.3rem;
      }
      .devices-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .logo-wrap {
        padding: 14px 20px;
      }
    }
  </style>
</head>

      <h1>تسجيل اهتمام الأطباء</h1>
      <p>سجّل بياناتك والأجهزة اللي مهتم بيها وهنتواصل معاك في أقرب وقت</p>
    </div>

    <!-- Form Card -->
    <div class="card" id="formCard">
      <form id="doctorForm" onsubmit="return false;">

        <!-- اسم الدكتور -->
        <div class="form-group">
          <label for="doctorName"><span class="required">*</span> اسم الدكتور</label>
          <input type="text" id="doctorName" name="اسم_الدكتور" required placeholder="أدخل الاسم الكامل" />
        </div>

        <!-- رقم التليفون -->
        <div class="form-group">
          <label for="phone"><span class="required">*</span> رقم التليفون</label>
          <input type="tel" id="phone" name="رقم_التليفون" required placeholder="01xxxxxxxxx" dir="ltr" style="text-align: right;" />
        </div>

        <!-- المحافظة -->
        <div class="form-group">
          <label for="governorate"><span class="required">*</span> المحافظة</label>
          <select id="governorate" name="المحافظة" required>
            <option value="" disabled selected>اختر المحافظة</option>
            <option value="القاهرة">القاهرة</option>
            <option value="الجيزة">الجيزة</option>
            <option value="الإسكندرية">الإسكندرية</option>
            <option value="الدقهلية">الدقهلية</option>
            <option value="الشرقية">الشرقية</option>
            <option value="الغربية">الغربية</option>
            <option value="المنوفية">المنوفية</option>
            <option value="القليوبية">القليوبية</option>
            <option value="البحيرة">البحيرة</option>
            <option value="كفر الشيخ">كفر الشيخ</option>
            <option value="دمياط">دمياط</option>
            <option value="بورسعيد">بورسعيد</option>
            <option value="الإسماعيلية">الإسماعيلية</option>
            <option value="السويس">السويس</option>
            <option value="شمال سيناء">شمال سيناء</option>
            <option value="جنوب سيناء">جنوب سيناء</option>
            <option value="بني سويف">بني سويف</option>
            <option value="الفيوم">الفيوم</option>
            <option value="المنيا">المنيا</option>
            <option value="أسيوط">أسيوط</option>
            <option value="سوهاج">سوهاج</option>
            <option value="قنا">قنا</option>
            <option value="الأقصر">الأقصر</option>
            <option value="أسوان">أسوان</option>
            <option value="البحر الأحمر">البحر الأحمر</option>
            <option value="الوادي الجديد">الوادي الجديد</option>
            <option value="مطروح">مطروح</option>
          </select>
        </div>

        <!-- العنوان -->
        <div class="form-group">
          <label for="address">العنوان التفصيلي</label>
          <input type="text" id="address" name="العنوان" placeholder="الشارع - المنطقة - المدينة" />
        </div>

        <!-- الأجهزة -->
        <div class="form-group">
          <div class="devices-section">
            <label><span class="required">*</span> الأجهزة المهتم بيها (يمكن اختيار أكثر من جهاز)</label>
            <div class="devices-grid" id="devicesGrid">
              <!-- Filled by JS -->
            </div>
          </div>
        </div>

        <!-- ملاحظات -->
        <div class="form-group">
          <label for="notes">ملاحظات إضافية</label>
          <textarea id="notes" name="ملاحظات" placeholder="أي تفاصيل أو استفسارات..."></textarea>
        </div>

        <div class="submit-wrap">
          <button type="submit">إرسال التسجيل</button>
        </div>
      </form>
    </div>

    <!-- Success (shown after redirect or via JS if needed) -->
    <div class="card success-msg" id="successMsg">
      <div class="success-icon">✓</div>
      <h2 style="color: var(--primary); margin-bottom: 10px;">تم الإرسال بنجاح!</h2>
      <p style="color: var(--muted);">شكراً لاهتمامك. هنتواصل معاك في أقرب وقت.</p>
    </div>

    <div class="footer">
      <p>© AL NAGAAR — Quality you can trust</p>
    </div>

  <script>
    // ===== CONFIG =====
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxiUn-IxvVEnP91qHEsRKObrLp-8AIkmKUYkBUnXWOxbYWqN5Ae5zST6fbQ4HohoIBm/exec";

    // Devices list
    const devices = [
      "DA10", "DA20", "Q5", "V300", "V200", "DV50",
      "VAFU", "DP10", "Q6", "DQ40", "T100", "T200",
      "SENSOR", "XRAY", "SCANNER V3", "SCANNER V5",
      "IMPLANT MOTOR", "PIEZO"
    ];

    // Render devices
    const grid = document.getElementById('devicesGrid');
    devices.forEach((dev, i) => {
      const div = document.createElement('div');
      div.className = 'device-item';
      div.innerHTML = `
        <input type="checkbox" id="dev${i}" name="الأجهزة_المهتم_بها" value="${dev}">
        <label for="dev${i}">${dev}</label>
      `;
      grid.appendChild(div);
    });

    // Handle form submit
    document.getElementById('doctorForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      // Validate at least one device
      const checked = document.querySelectorAll('input[name="الأجهزة_المهتم_بها"]:checked');
      if (checked.length === 0) {
        alert('من فضلك اختر جهاز واحد على الأقل');
        return;
      }

      const btn = this.querySelector('button[type="submit"]');
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'جاري الإرسال...';

      // Collect form data
      const formData = new FormData(this);

      // Collect devices as array then join
      const selectedDevices = Array.from(checked).map(c => c.value);
      formData.delete('الأجهزة_المهتم_بها');
      formData.append('الأجهزة_المهتم_بها', selectedDevices.join(' - '));

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: formData
        });

        // Apps Script usually returns 200 even on success
        // Show success UI
        document.getElementById('formCard').style.display = 'none';
        document.getElementById('successMsg').classList.add('show');
        
        // Optional: scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });

      } catch (err) {
        console.error(err);
        alert('حصل خطأ أثناء الإرسال. حاول مرة تانية أو تأكد من الاتصال بالإنترنت.');
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });
  </script>
