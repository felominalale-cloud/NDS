<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NDS New Dent - تسجيل الحضور</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body {
      background: linear-gradient(160deg, #0c4a6e 0%, #0f172a 60%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 28px 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      color: #1e293b;
    }
    .logo {
      text-align: center;
      margin-bottom: 8px;
    }
    .logo-text {
      font-size: 2.4rem;
      font-weight: 800;
      color: #0e7490;
      letter-spacing: -1px;
    }
    .logo-sub {
      font-size: 0.95rem;
      color: #64748b;
      margin-top: -4px;
    }
    .company {
      text-align: center;
      font-size: 0.85rem;
      color: #0e7490;
      font-weight: 600;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 1.25rem;
      text-align: center;
      margin-bottom: 4px;
      color: #0f172a;
    }
    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 0.88rem;
      margin-bottom: 22px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.92rem;
      color: #334155;
      font-weight: 500;
    }
    input[type="text"] {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      font-size: 1rem;
      margin-bottom: 16px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #0e7490; background: #fff; }
    .status-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }
    .status-btn {
      padding: 12px 6px;
      border-radius: 11px;
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      color: #475569;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
      font-weight: 500;
    }
    .status-btn.active {
      border-color: #0e7490;
      background: #ecfeff;
      color: #0e7490;
      font-weight: 700;
    }
    .status-btn.red.active {
      border-color: #ef4444;
      background: #fef2f2;
      color: #dc2626;
    }
    .status-btn.yellow.active {
      border-color: #d97706;
      background: #fffbeb;
      color: #b45309;
    }
    .main-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #0e7490, #0891b2);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(14,116,144,0.35);
    }
    .main-btn:disabled {
      background: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }
    .status-msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: 11px;
      text-align: center;
      font-size: 0.92rem;
      display: none;
      font-weight: 500;
    }
    .status-msg.loading { display: block; background: #ecfeff; color: #0e7490; border: 1px solid #a5f3fc; }
    .status-msg.success { display: block; background: #f0fdf4; color: #16a34a; border: 1px solid #86efac; }
    .status-msg.error { display: block; background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
    .note {
      margin-top: 18px;
      font-size: 0.75rem;
      color: #94a3b8;
      text-align: center;
      line-height: 1.5;
    }
    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 0.7rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-text">NDS</div>
      <div class="logo-sub">New Dent</div>
    </div>
    <div class="company">شركة NDS لطب الأسنان</div>

    <h1>📍 تسجيل الحضور والموقع</h1>
    <p class="subtitle">اضغط الزر لإرسال موقعك الحالي للإدارة</p>

    <form name="nds-checkin" method="POST" data-netlify="true" id="checkinForm">
      <input type="hidden" name="form-name" value="nds-checkin">

      <label for="employeeName">اسم الموظف</label>
      <input type="text" id="employeeName" name="الاسم" placeholder="اكتب اسمك هنا" required>

      <label>الحالة الحالية</label>
      <div class="status-group">
        <button type="button" class="status-btn active" data-status="شغال الآن">شغال الآن</button>
        <button type="button" class="status-btn yellow" data-status="في الطريق">في الطريق</button>
        <button type="button" class="status-btn red" data-status="خلصت الشغل">خلصت الشغل</button>
        <button type="button" class="status-btn" data-status="أخرى">أخرى</button>
      </div>
      <input type="hidden" name="الحالة" id="statusInput" value="شغال الآن">

      <input type="hidden" name="خط_العرض" id="latInput">
      <input type="hidden" name="خط_الطول" id="lngInput">
      <input type="hidden" name="الدقة_بالمتر" id="accInput">
      <input type="hidden" name="رابط_الخريطة" id="mapsInput">
      <input type="hidden" name="الوقت" id="timeInput">

      <button type="button" class="main-btn" id="sendBtn">إرسال موقعي الآن</button>
    </form>

    <div class="status-msg" id="statusMsg"></div>

    <p class="note">سيتم إرسال اسمك + حالتك + موقعك + رابط الخريطة إلى إدارة NDS.</p>
    <div class="footer">© NDS New Dent</div>
  </div>

  <script>
    let selectedStatus = "شغال الآن";
    document.querySelectorAll('.status-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedStatus = btn.dataset.status;
        document.getElementById('statusInput').value = selectedStatus;
      });
    });

    const sendBtn = document.getElementById('sendBtn');
    const statusMsg = document.getElementById('statusMsg');
    const nameInput = document.getElementById('employeeName');
    const form = document.getElementById('checkinForm');

    function showMsg(type, text) {
      statusMsg.className = 'status-msg ' + type;
      statusMsg.textContent = text;
    }

    sendBtn.addEventListener('click', () => {
      const name = nameInput.value.trim();
      if (!name) {
        showMsg('error', 'من فضلك اكتب اسمك أولاً');
        nameInput.focus();
        return;
      }

      sendBtn.disabled = true;
      showMsg('loading', 'جاري تحديد موقعك... انتظر لحظات');

      if (!navigator.geolocation) {
        showMsg('error', 'المتصفح لا يدعم تحديد الموقع');
        sendBtn.disabled = false;
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude.toFixed(6);
          const lng = position.coords.longitude.toFixed(6);
          const accuracy = Math.round(position.coords.accuracy);
          const mapsLink = `https://www.google.com/maps?q=${lat},${lng}`;
          const now = new Date().toLocaleString('ar-EG', { dateStyle: 'full', timeStyle: 'medium' });

          document.getElementById('latInput').value = lat;
          document.getElementById('lngInput').value = lng;
          document.getElementById('accInput').value = accuracy + " متر";
          document.getElementById('mapsInput').value = mapsLink;
          document.getElementById('timeInput').value = now;
          document.getElementById('statusInput').value = selectedStatus;

          // For GitHub Pages we use a simple alert + copy or fallback
          // Since no backend, we show the data and open email
          const subject = encodeURIComponent(`📍 NDS - موقع جديد | ${name} (${selectedStatus})`);
          const body = encodeURIComponent(
`الشركة: NDS New Dent
الاسم: ${name}
الحالة: ${selectedStatus}
الوقت: ${now}
خط العرض: ${lat}
خط الطول: ${lng}
الدقة: ${accuracy} متر
رابط الخريطة: ${mapsLink}`
          );

          // Open email app with pre-filled data
          window.location.href = `mailto:mina_megally@yahoo.com?subject=${subject}&body=${body}`;

          showMsg('success', '✅ تم فتح الإيميل. اضغط إرسال في تطبيق البريد');
          setTimeout(() => {
            nameInput.value = '';
            sendBtn.disabled = false;
          }, 4000);
        },
        (error) => {
          let msg = 'تعذر الحصول على الموقع. ';
          if (error.code === 1) msg += 'يجب الموافقة على إذن الموقع.';
          else if (error.code === 2) msg += 'الموقع غير متاح حالياً.';
          else if (error.code === 3) msg += 'انتهى الوقت، حاول مرة أخرى.';
          else msg += 'خطأ غير معروف.';
          showMsg('error', msg);
          sendBtn.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });
  </script>
</body>
</html>
